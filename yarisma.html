<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Baş Başa Bilgi Yarışması</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tek ekranlık "canlı yayın stüdyosu" — üstte CANLI tabelası ve skor şeridi, ortada soru kartı, altta jokerler */
:root {
  --ink: #1d1b18;
  --panel: #2a2723;
  --panel-2: #35312b;
  --line: #4a443b;
  --paper: #f7f1e6;
  --muted: #b8ae9d;
  --gold: #fbbf1a;
  --gold-deep: #c89310;
  --live: #ff4b3e;
  --good: #4fc985;
  --bad: #ff6b5e;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* Üst şerit */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.live {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: .18em;
  padding: 6px 12px; border: 2px solid var(--line); border-radius: 4px; color: var(--muted);
  transition: color .3s, border-color .3s, box-shadow .3s;
}
.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: background .3s; }
.live.on { color: var(--live); border-color: var(--live); box-shadow: 0 0 18px -4px var(--live); }
.live.on::before { background: var(--live); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.stats { display: flex; gap: 18px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--paper); font-size: 15px; }

/* Giriş ekranı */
.intro { display: flex; flex-direction: column; gap: 22px; padding-top: 6vh; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
h1 {
  font-family: var(--f-display); font-weight: 800; margin: 0;
  font-size: clamp(44px, 10vw, 84px); line-height: .95; letter-spacing: -.02em; text-wrap: balance;
}
h1 span { color: var(--gold); display: block; }
.lede { color: var(--muted); max-width: 56ch; margin: 0; font-size: 17px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.rule { background: var(--panel); border-radius: 10px; padding: 14px 16px; }
.rule strong { display: block; font-family: var(--f-display); font-size: 22px; color: var(--gold); }
.rule small { color: var(--muted); font-size: 14px; }
.cta {
  align-self: flex-start;
  background: var(--gold); color: var(--ink); border: 0; border-radius: 999px;
  font-weight: 700; font-size: 18px; padding: 14px 30px;
  transition: transform .15s, background .15s;
}
.cta:hover { background: #ffd24d; transform: translateY(-1px); }
.best { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* Soru ekranı */
.stage { display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.segment { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.progress { display: flex; gap: 4px; }
.progress i { width: 18px; height: 6px; border-radius: 3px; background: var(--panel-2); }
.progress i.ok { background: var(--good); }
.progress i.no { background: var(--bad); }
.progress i.now { background: var(--gold); }
.timer { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.timer > div { height: 100%; background: var(--gold); width: 100%; transform-origin: left; }
.timer.low > div { background: var(--live); }
.question {
  font-family: var(--f-display); font-weight: 800;
  font-size: clamp(24px, 5vw, 36px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance;
}
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .answers { grid-template-columns: 1fr; } }
.ans {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
  padding: 14px 16px; font-size: 17px; font-weight: 600; min-width: 0;
  transition: border-color .15s, background .15s, opacity .2s;
}
.ans .k {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px;
  background: var(--panel-2); color: var(--gold);
}
.ans .t { min-width: 0; overflow-wrap: anywhere; }
.ans .pct { margin-left: auto; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.ans:hover:not(:disabled) { border-color: var(--gold); background: var(--panel-2); }
.ans:disabled { cursor: default; }
.ans.gone { opacity: .18; }
.ans.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--panel)); }
.ans.right .k { background: var(--good); color: var(--ink); }
.ans.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel)); }
.ans.wrong .k { background: var(--bad); color: var(--ink); }
.ans .bar { display: block; height: 4px; border-radius: 2px; background: var(--gold); margin-top: 6px; }

.reveal {
  background: var(--paper); color: var(--ink); border-radius: 12px; padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.reveal h3 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.reveal p { margin: 0; font-size: 15px; color: #4b443a; }
.reveal .next {
  align-self: flex-end; background: var(--ink); color: var(--paper); border: 0;
  border-radius: 999px; padding: 10px 22px; font-weight: 700;
}

.jokers { display: flex; gap: 10px; flex-wrap: wrap; }
.joker {
  background: transparent; border: 2px dashed var(--gold-deep); color: var(--gold);
  border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px;
}
.joker:disabled { border-color: var(--line); color: var(--line); text-decoration: line-through; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }

/* Sonuç */
.final { display: flex; flex-direction: column; gap: 18px; padding-top: 4vh; }
.score-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 16vw, 120px); line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.title-earned { font-family: var(--f-display); font-size: clamp(26px, 5vw, 36px); font-weight: 800; margin: 0; text-wrap: balance; }
.recap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 480px) { .recap { grid-template-columns: 1fr 1fr; } }
.recap div { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
.recap b { display: block; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.recap small { color: var(--muted); font-size: 13px; }
.footer { margin-top: auto; font-size: 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="topbar">
    <span class="live" id="live">CANLI</span>
    <div class="stats" id="stats" hidden>
      <span>Soru <b id="sNum">1</b>/<span id="sTot">10</span></span>
      <span>Puan <b id="sScore">0</b></span>
    </div>
  </header>

  <main id="app"></main>

  <p class="footer"><a href="index.html" style="color:#fbbf1a">← Yolculuk oyununa dön</a> · Sorular “Seda Sayan’la Baş Başa” proje sunumundaki bilgilerden hazırlandı · Organizaction Event &amp; Management</p>
</div>

<script>
const POOL = [
  { seg: "Hayat hikâyesi", q: "Seda Sayan’ın ilk plağı hangi adla çıktı?", a: ["Aysel Gül", "Seda Gül", "Aysel Sayan", "Seda Aysel"], c: 0,
    x: "1983’teki ilk plak Aysel Gül adıyla çıktı. Gösterideki “İlk plak sürprizi” anı bu hikâyeye dayanıyor." },
  { seg: "Hayat hikâyesi", q: "1983’teki ilk plağın adı neydi?", a: ["Ah Geceler", "Yandı Pilav Tavası", "Evleneceksen Gel", "Tabi Tabi"], c: 1,
    x: "“Yandı Pilav Tavası”. Müzisyenler 1. perdede bu parçanın girişini sürpriz olarak çalıyor." },
  { seg: "Avlu", q: "Çocukluğunun geçtiği Eyüp’teki avluyu kaç aile paylaşıyordu?", a: ["4", "7", "11", "15"], c: 2,
    x: "11 aile. Avlu, 1. perdenin 10–20. dakikalarında çamaşır ipi ve ekrandaki gecekonduyla sahneye geliyor." },
  { seg: "Gazino", q: "80’lerde assolist olduğu gazinolardan biri hangisi?", a: ["Maksim", "Lido", "Kervansaray", "Çakıl"], c: 0,
    x: "Stardust, Gülizar ve Maksim. 1. perdenin adı da buradan geliyor: Gecekondudan Maksim’e." },
  { seg: "Gösterinin adı", q: "“Seda Sayan’la Baş Başa” aslında hangi yılın albümünün adı?", a: ["1983", "1985", "1987", "1992"], c: 2,
    x: "1987 albümü. İsim seçilirken en önemli artısı, seyircinin onu albümden hatırlaması oldu." },
  { seg: "Konsept", q: "Gösteri toplam kaç dakika sürüyor?", a: ["90", "110", "130", "150"], c: 2,
    x: "130 dakika: 2 perde, 13 bölüm." },
  { seg: "Turne", q: "Turnenin prömiyeri hangi gün, hangi şehirde?", a: ["15 Ocak · İstanbul", "22 Ocak · Ankara", "19 Mart · Antalya", "29 Ocak · İzmir"], c: 0,
    x: "15 Ocak 2027, İstanbul, Zorlu PSM Turkcell Sahnesi. Metin yazımı gecikirse prömiyer 22 Ocak’a kayıyor." },
  { seg: "Sinema", q: "2. perdedeki “Emanet” sahnesi hangi filmden geliyor?", a: ["Bacıların Bacısı", "Ayakçı", "Ah Geceler", "Anılarım"], c: 1,
    x: "“Ayakçı” filmindeki konuşulan şişe sahnesi, efekt camı ve ağır çekim ışıkla esprili biçimde tekrarlanıyor." },
  { seg: "Final", q: "Finalde Seda Sayan kiminle düet yapıyor?", a: ["Kibariye", "Tekir", "Bir yerel koro", "DJ"], c: 1,
    x: "Tekir. Rap girişiyle başlayan finalde “Yıkamazlar Beni” ve “Gel Günaha Girelim” söyleniyor." },
  { seg: "Uvertür", q: "1. perdedeki geçişte kimden bir video ekrana geliyor?", a: ["Tekir", "Kibariye", "Bir yarışmacı", "Seyirciden biri"], c: 1,
    x: "Kibariye. Uvertür sırasında Reji anons yapıyor, Seda Sayan kostüm değiştiriyor." },
  { seg: "Açılış", q: "Seda Sayan sahneye nasıl giriyor?", a: ["Kuliste, sessizce", "Seyircinin arasından, lokum tepsisiyle", "Tavandan inerek", "Bir arabayla"], c: 1,
    x: "Seyircinin arasından, elinde lokum tepsisiyle. İlk sıralara lokum ikram ediyor." },
  { seg: "Bis", q: "Bis’te bütün salon hangi şarkıyı birlikte söylüyor?", a: ["Tabi Tabi", "Var mısın", "Ah Geceler", "Yağmur Altında Eriyorum"], c: 2,
    x: "“Ah Geceler”. Bu sırada ekranda seyircinin fotoğraflarıyla dolan albüm görünüyor." },
  { seg: "Salonlar", q: "Turnenin en küçük salonu hangi şehirde?", a: ["Trabzon", "Gaziantep", "Samsun", "İzmir"], c: 2,
    x: "Samsun Atatürk Kültür Merkezi, 550 koltuk. Bu yüzden aynı gün iki seans öneriliyor." },
  { seg: "Turne", q: "Turnenin toplam koltuk sayısı yaklaşık kaç?", a: ["8.000", "15.000", "23.000", "40.000"], c: 2,
    x: "Yaklaşık 23.000 koltuk, 15 şehirde Cuma–Cumartesi çiftleri halinde." },
  { seg: "Turne", q: "Şubat ve Mart arasında turneye neden ara veriliyor?", a: ["Kar tatili", "Ramazan", "Film çekimi", "Prova"], c: 1,
    x: "Ramazan arası. Turne 19 Mart’ta Antalya’da yeniden başlıyor." },
  { seg: "Ekran", q: "Seda Sayan kaçtan fazla TV programı yaptı?", a: ["3", "5", "10", "25"], c: 2,
    x: "10’dan fazla. 1992’den sonra herkesin “Seda abla”sı oldu; 2. perde bu yılların parodisi." },
  { seg: "Canlı yayın", q: "2. perdedeki “canlı yayın” parodisinde hangisi yok?", a: ["Evlilik teklifi", "Seyirci soruları", "Yöresel tatlıya puan", "Hava durumu"], c: 3,
    x: "Hava durumu yok. Evleneceksen Gel, Seda’ya Sorun ve Yemekteyiz kuşakları sahnede canlanıyor." },
  { seg: "Prodüksiyon", q: "Tüm turne ekipmanı kaç araçla taşınıyor?", a: ["1 kamyonet", "2 tır", "3 minibüs", "5 kamyon"], c: 0,
    x: "Tek kamyonet. Sabit dekor koltuk, sehpa ve aynadan ibaret; kurulum 3 saat." },
];
const ROUND = 10, TIME = 20;
const app = document.getElementById("app");
const live = document.getElementById("live");
const stats = document.getElementById("stats");
const $ = id => document.getElementById(id);

let S = null, timerId = null;

function getBest() { try { return +localStorage.getItem("basbasa-best") || 0; } catch { return 0; } }
function setBest(v) { try { localStorage.setItem("basbasa-best", v); } catch {} }

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function intro() {
  clearInterval(timerId); S = null;
  live.classList.remove("on"); stats.hidden = true;
  const best = getBest();
  app.innerHTML = `
    <section class="intro">
      <span class="eyebrow">Tek kişilik gösteri · 15 şehir turnesi</span>
      <h1>Seda Sayan’la<span>Baş Başa</span></h1>
      <p class="lede">Stüdyo hazır, tabela yanmak üzere. Gecekondudan Maksim’e, sabah programlarından “Ayakçı”ya kadar Seda Sayan’ı ve gösteriyi ne kadar tanıyorsun?</p>
      <div class="rules">
        <div class="rule"><strong>${ROUND} soru</strong><small>Her oyunda havuzdan farklı sorular</small></div>
        <div class="rule"><strong>${TIME} saniye</strong><small>Hızlı cevap daha çok puan getirir</small></div>
        <div class="rule"><strong>2 joker</strong><small>Yarı yarıya ve Seyirciye sor, birer kez</small></div>
      </div>
      <button class="cta" id="start">Yayını başlat</button>
      ${best ? `<span class="best">En yüksek puanın: ${best}</span>` : ""}
    </section>`;
  $("start").onclick = start;
  $("start").focus();
}

function start() {
  S = { qs: shuffle(POOL).slice(0, ROUND).map(q => {
          const order = shuffle([0, 1, 2, 3]);
          return { ...q, a: order.map(i => q.a[i]), c: order.indexOf(q.c) };
        }),
        i: 0, score: 0, results: [], jokers: { half: true, crowd: true }, fastest: null };
  live.classList.add("on"); stats.hidden = false;
  $("sTot").textContent = ROUND;
  ask();
}

function ask() {
  const q = S.qs[S.i];
  S.left = TIME; S.answered = false; S.removed = []; S.crowd = null;
  $("sNum").textContent = S.i + 1; $("sScore").textContent = S.score;
  render();
  clearInterval(timerId);
  const t0 = performance.now();
  timerId = setInterval(() => {
    S.left = Math.max(0, TIME - (performance.now() - t0) / 1000);
    const bar = document.querySelector(".timer > div");
    if (bar) { bar.style.transform = `scaleX(${S.left / TIME})`; bar.parentElement.classList.toggle("low", S.left < 6); }
    if (S.left <= 0) answer(-1);
  }, 100);
}

function render() {
  const q = S.qs[S.i];
  const prog = S.qs.map((_, k) => `<i class="${k < S.results.length ? (S.results[k] ? "ok" : "no") : k === S.i ? "now" : ""}"></i>`).join("");
  app.innerHTML = `
    <section class="stage">
      <div class="qmeta"><span class="segment">${esc(q.seg)}</span><div class="progress" aria-hidden="true">${prog}</div></div>
      <div class="timer" aria-hidden="true"><div style="transform:scaleX(${S.left / TIME})"></div></div>
      <h2 class="question">${esc(q.q)}</h2>
      <div class="answers" id="answers">
        ${q.a.map((t, k) => `
          <button class="ans" id="ans${k}" data-k="${k}">
            <span class="k">${"ABCD"[k]}</span>
            <span class="t">${esc(t)}${S.crowd ? `<span class="bar" style="width:${S.crowd[k]}%"></span>` : ""}</span>
            ${S.crowd ? `<span class="pct">%${S.crowd[k]}</span>` : ""}
          </button>`).join("")}
      </div>
      <div id="after"></div>
      <div class="jokers">
        <button class="joker" id="jHalf" ${S.jokers.half ? "" : "disabled"}>Yarı yarıya</button>
        <button class="joker" id="jCrowd" ${S.jokers.crowd ? "" : "disabled"}>Seyirciye sor</button>
      </div>
      <span class="hint">Klavyeden A, B, C, D tuşlarıyla da cevaplayabilirsin.</span>
    </section>`;
  S.removed.forEach(k => { const b = $("ans" + k); b.classList.add("gone"); b.disabled = true; });
  document.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.k));
  $("jHalf").onclick = useHalf;
  $("jCrowd").onclick = useCrowd;
}

function useHalf() {
  if (!S.jokers.half || S.answered) return;
  const q = S.qs[S.i];
  S.jokers.half = false;
  S.removed = shuffle([0, 1, 2, 3].filter(k => k !== q.c && !S.removed.includes(k))).slice(0, 2);
  keepTimerRender();
}

function useCrowd() {
  if (!S.jokers.crowd || S.answered) return;
  const q = S.qs[S.i];
  S.jokers.crowd = false;
  const open = [0, 1, 2, 3].filter(k => !S.removed.includes(k));
  const w = [0, 0, 0, 0];
  open.forEach(k => w[k] = k === q.c ? 45 + Math.random() * 30 : 5 + Math.random() * 18);
  const sum = w.reduce((a, b) => a + b, 0);
  const pct = w.map(v => Math.round(v / sum * 100));
  pct[q.c] += 100 - pct.reduce((a, b) => a + b, 0);
  S.crowd = pct;
  keepTimerRender();
}

function keepTimerRender() { render(); }

function answer(k) {
  if (S.answered) return;
  S.answered = true;
  clearInterval(timerId);
  const q = S.qs[S.i];
  const ok = k === q.c;
  let gained = 0;
  if (ok) {
    gained = 100 + Math.round(S.left * 5);
    S.score += gained;
    const used = TIME - S.left;
    if (S.fastest === null || used < S.fastest) S.fastest = used;
  }
  S.results.push(ok);
  $("sScore").textContent = S.score;
  document.querySelectorAll(".ans").forEach(b => b.disabled = true);
  $("ans" + q.c).classList.add("right");
  if (k >= 0 && !ok) $("ans" + k).classList.add("wrong");
  document.querySelectorAll(".progress i")[S.i].className = ok ? "ok" : "no";
  const head = ok ? `Doğru! +${gained} puan` : k < 0 ? "Süre doldu" : "Olmadı";
  const last = S.i === ROUND - 1;
  $("after").innerHTML = `
    <div class="reveal" role="status">
      <h3>${head}</h3>
      <p>${esc(q.x)}</p>
      <button class="next" id="next">${last ? "Sonuçları gör" : "Sıradaki soru"}</button>
    </div>`;
  $("next").onclick = () => { if (last) finish(); else { S.i++; ask(); } };
  $("next").focus();
}

function finish() {
  live.classList.remove("on");
  const right = S.results.filter(Boolean).length;
  const best = getBest();
  const isBest = S.score > best;
  if (isBest) setBest(S.score);
  const title =
    right >= 9 ? "Baş misafir: Seda abla seni ön sıraya oturtur" :
    right >= 7 ? "Ah Geceler kuşağı: albümü ezbere biliyorsun" :
    right >= 4 ? "Gazino müdavimi: biraz daha prova lazım" :
                 "Avludaki yeni komşu: yayına yeni katıldın";
  app.innerHTML = `
    <section class="final">
      <span class="eyebrow">Yayın bitti</span>
      <div class="score-big">${S.score}</div>
      <h2 class="title-earned">${title}</h2>
      <div class="recap">
        <div><b>${right}/${ROUND}</b><small>Doğru cevap</small></div>
        <div><b>${S.fastest === null ? "—" : S.fastest.toFixed(1) + " sn"}</b><small>En hızlı doğru</small></div>
        <div><b>${isBest ? "Yeni!" : (best || "—")}</b><small>${isBest ? "En yüksek puan" : "Önceki rekor"}</small></div>
      </div>
      <button class="cta" id="again">Tekrar oyna</button>
      <button class="joker" id="home" style="align-self:flex-start">Başa dön</button>
    </section>`;
  $("again").onclick = start;
  $("home").onclick = intro;
  $("again").focus();
}

document.addEventListener("keydown", e => {
  if (!S || S.answered || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = "abcd".indexOf(e.key.toLowerCase());
  if (k < 0) return;
  const b = $("ans" + k);
  if (b && !b.disabled) answer(k);
});

intro();
</script>

</body>
</html>
